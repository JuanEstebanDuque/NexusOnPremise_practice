server:
  port: 8080

spring:
  application:
    name: product-api
  datasource:
    url: ${DB_URL:jbdc:h2:mem:productdb}    
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Configuración de CORS
cors:
  allowed-origins: "*"
